name: Compilar para Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar instalador e versão portátil
        run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: Bussola-MGF-Windows
          path: dist/*.exe
          retention-days: 30
